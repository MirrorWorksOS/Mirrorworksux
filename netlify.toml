# Vite outputs to `build` (see vite.config.ts `build.outDir`), not the default `dist`.
[build]
  command = "npm run build --workspace @mirrorworks/web"
  publish = "apps/web/build"

# Hashed build assets never change content for a given URL — cache forever.
# (Netlify's default is max-age=0 + ETag revalidation, which costs a 304
# round-trip per asset on every visit.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Client-side routing (React Router): serve index.html for deep links and refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
